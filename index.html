function searchPlaces(moveToFirst=false){const query=placeSearch.value.trim().replaceAll(' ','');const found=Object.entries(places).filter(([,p])=>p.name.replaceAll(' ','').includes(query));Object.entries(places).forEach(([id])=>markers[id].getElement().querySelector('.pin').classList.toggle('dim',query!==''&&!found.some(([foundId])=>foundId===id)));document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));if(!query){searchStatus.textContent='장소명을 입력하면 해당 마커를 지도에서 찾을 수 있어요.';return}searchStatus.textContent=found.length?found.length+'개 장소를 찾았습니다.':'일치하는 장소가 없어요.';if(found.length===1||moveToFirst&&found.length)show(found[0][0])}

let myLocationMarker,myAccuracyCircle;const locationBtn=document.querySelector('#locationBtn'),locationStatus=document.querySelector('#locationStatus');
locationBtn.onclick=()=>{if(!navigator.geolocation){locationStatus.textContent='이 기기에서는 GPS(현재 위치) 기능을 사용할 수 없어요.';return}locationBtn.disabled=true;locationBtn.textContent='위치 확인 중…';locationStatus.textContent='브라우저의 위치 정보 사용 허용을 기다리고 있어요.';navigator.geolocation.getCurrentPosition(position=>{const here=[position.coords.latitude,position.coords.longitude],accuracy=position.coords.accuracy;if(myLocationMarker)map.removeLayer(myLocationMarker);if(myAccuracyCircle)map.removeLayer(myAccuracyCircle);myLocationMarker=L.circleMarker(here,{radius:9,color:'#fff',weight:3,fillColor:'#1677ff',fillOpacity:1}).addTo(map).bindPopup('내 현재 위치').openPopup();myAccuracyCircle=L.circle(here,{radius:accuracy,color:'#1677ff',weight:1,fillColor:'#1677ff',fillOpacity:.12}).addTo(map);map.setView(here,14);locationBtn.disabled=false;locationBtn.textContent='◎ 내 위치 다시 찾기';locationStatus.textContent='파란 점이 현재 위치예요. 정확도는 약 '+Math.round(accuracy)+'m입니다.'},error=>{const message={1:'위치 정보 사용이 허용되지 않았어요. 브라우저 설정에서 허용해 주세요.',2:'현재 위치를 찾을 수 없어요. GPS 또는 인터넷 연결을 확인해 주세요.',3:'위치 확인 시간이 초과되었어요. 다시 시도해 주세요.'};locationStatus.textContent=message[error.code]||'현재 위치를 확인할 수 없어요.';locationBtn.disabled=false;locationBtn.textContent='◎ 내 위치 표시하기'},{enableHighAccuracy:true,timeout:10000,maximumAge:0})};
function postListHtml(){if(!communityPosts.length)return '<p class="empty-review">'+(firebaseReady?'아직 게시글이 없어요. 첫 글을 남겨보세요.':'게시판 연결 중…')+'</p>';return communityPosts.map(post=>'<article class="post-item"><h4>'+escapeHtml(post.title)+'</h4><p>'+escapeHtml(post.text)+'</p><span class="post-date">익명 · '+new Date(post.createdAtMs).toLocaleString('ko-KR')+'</span></article>').join('')}
function renderBoard(){const list=document.querySelector('#boardPosts');if(list)list.innerHTML='<h3>새 글 ('+communityPosts.length+')</h3><div class="post-filters"><button class="post-filter '+(activePostCategory==='all'?'active':'')+'" type="button" data-category="all">전체</button><button class="post-filter '+(activePostCategory==='fish'?'active':'')+'" type="button" data-category="fish">🎣 낚시</button><button class="post-filter '+(activePostCategory==='camp'?'active':'')+'" type="button" data-category="camp">🚐 차박 및 캠핑</button></div><div class="post-sorts"><button class="post-sort '+(postSort==='latest'?'active':'')+'" type="button" data-post-sort="latest">최신순</button><button class="post-sort '+(postSort==='oldest'?'active':'')+'" type="button" data-post-sort="oldest">오래된순</button><button class="post-sort '+(postSort==='random'?'active':'')+'" type="button" data-post-sort="random">랜덤</button></div>'+postListHtml()}
function startPostListener(){if(!firebaseReady||unsubscribePosts)return;const postQuery=firestore.query(firestore.collection(db,'communityPosts'),firestore.orderBy('createdAtMs','desc'));unsubscribePosts=firestore.onSnapshot(postQuery,snapshot=>{communityPosts=snapshot.docs.map(doc=>doc.data());renderBoard()},()=>{const list=document.querySelector('#boardPosts');if(list)list.innerHTML='<h3>새 글</h3><p class="empty-review">게시판을 연결하지 못했어요. 잠시 후 다시 시도해 주세요.</p>'})}
let activePostCategory='all',postSort='latest';
function postListHtml(){const visible=(activePostCategory==='all'?communityPosts:communityPosts.filter(post=>post.category===activePostCategory)).slice();if(postSort==='oldest')visible.sort((a,b)=>a.createdAtMs-b.createdAtMs);else if(postSort==='random')visible.sort(()=>Math.random()-.5);else visible.sort((a,b)=>b.createdAtMs-a.createdAtMs);if(!visible.length)return '<p class="empty-review">'+(firebaseReady?'아직 이 카테고리의 게시글이 없어요. 첫 글을 남겨보세요.':'게시판 연결 중…')+'</p>';return visible.map(post=>'<article class="post-item"><span class="post-category '+(post.category||'all')+'">'+(post.category==='fish'?'🎣 낚시':post.category==='camp'?'🚐 차박 및 캠핑':'💬 전체')+'</span><h4>'+escapeHtml(post.title)+'</h4><p>'+escapeHtml(post.text)+'</p><span class="post-date">익명 · '+new Date(post.createdAtMs).toLocaleString('ko-KR')+'</span></article>').join('')}
function setupBoardCategories(){const page=document.querySelector('#communityPage'),intro=page.querySelector('.community-head p'),form=page.querySelector('#postForm');intro.innerHTML='부산 바다의 안전 정보와 이용 경험을 나눠요.<br><b>자신만의 숨겨진 명소를 공유해봐요.</b>';form.querySelector('#postTitle').insertAdjacentHTML('beforebegin','<select class="post-category-select" id="postCategory" aria-label="게시글 카테고리"><option value="all">💬 전체</option><option value="fish">🎣 낚시</option><option value="camp">🚐 차박 및 캠핑</option></select>');page.querySelector('.board-list').insertAdjacentHTML('afterbegin','<div class="post-filters"><button class="post-filter active" type="button" data-category="all">전체</button><button class="post-filter" type="button" data-category="fish">🎣 낚시</button><button class="post-filter" type="button" data-category="camp">🚐 차박 및 캠핑</button></div>');page.addEventListener('click',event=>{const button=event.target.closest('[data-category]');if(!button)return;activePostCategory=button.dataset.category;page.querySelectorAll('.post-filter').forEach(item=>item.classList.toggle('active',item===button));renderBoard()});page.addEventListener('submit',async event=>{if(event.target.id!=='postForm')return;event.preventDefault();event.stopImmediatePropagation();const title=document.querySelector('#postTitle').value.trim(),text=document.querySelector('#postText').value.trim(),category=document.querySelector('#postCategory').value;if(!title||!text)return;if(!ensureSignedIn())return;try{await firestore.addDoc(firestore.collection(db,'communityPosts'),{title,text,category,authorId:currentUser.uid,createdAtMs:Date.now()});event.target.reset()}catch{alert('게시글을 저장하지 못했어요. Firestore 보안 규칙과 인터넷 연결을 확인해 주세요.')}},true)}
function setupBoardSorting(){const page=document.querySelector('#communityPage');page.addEventListener('click',event=>{const button=event.target.closest('[data-post-sort]');if(!button)return;postSort=button.dataset.postSort;renderBoard()})}
function setupCommunityUI(){const main=document.querySelector('main'),guidePage=document.createElement('section'),communityPage=document.createElement('section'),tabs=document.createElement('nav');guidePage.id='guidePage';guidePage.className='app-page';communityPage.id='communityPage';communityPage.className='app-page';communityPage.hidden=true;tabs.className='page-tabs';tabs.setAttribute('aria-label','화면 이동');tabs.innerHTML='<button class="page-tab active" type="button" data-page="guide">🗺️ 바다 지도</button><button class="page-tab" type="button" data-page="community">💬 게시판</button>';communityPage.innerHTML='<div class="community-head"><h2>바다 이야기 게시판</h2><p>부산 바다의 안전 정보와 이용 경험을 나눠요.</p></div><section class="post-compose"><h3>새 글 작성</h3><form id="postForm"><input class="post-title" id="postTitle" maxlength="60" placeholder="제목 (최대 60자)" required><textarea class="post-text" id="postText" maxlength="500" placeholder="안전한 이용 정보와 경험을 적어주세요." required></textarea><button class="post-submit" type="submit">게시글 등록</button><p class="board-note">모든 글은 공개됩니다. 실명, 연락처, 정확한 개인 위치 등 개인정보는 작성하지 마세요.</p></form></section><section class="board-list" id="boardPosts"><h3>새 글</h3><p class="empty-review">게시판 연결 중…</p></section>';while(main.firstChild)guidePage.append(main.firstChild);main.append(tabs,guidePage,communityPage);tabs.addEventListener('click',event=>{const button=event.target.closest('[data-page]');if(!button)return;const isGuide=button.dataset.page==='guide';guidePage.hidden=!isGuide;communityPage.hidden=isGuide;tabs.querySelectorAll('.page-tab').forEach(tab=>tab.classList.toggle('active',tab===button));if(isGuide)setTimeout(()=>map.invalidateSize(),0);else{renderBoard();startPostListener()}});communityPage.addEventListener('submit',async event=>{if(event.target.id!=='postForm')return;event.preventDefault();const title=document.querySelector('#postTitle').value.trim(),text=document.querySelector('#postText').value.trim();if(!title||!text)return;if(!firebaseReady){alert('게시판 연결을 준비 중입니다. 잠시 후 다시 시도해 주세요.');return}try{await firestore.addDoc(firestore.collection(db,'communityPosts'),{title,text,createdAtMs:Date.now()});event.target.reset()}catch{alert('게시글을 저장하지 못했어요. Firestore 보안 규칙과 인터넷 연결을 확인해 주세요.')}})}
const safetyNotice=document.createElement('div');safetyNotice.className='notice';safetyNotice.textContent='⚠️ 실제 방문 전 최신 현장 안내를 꼭 확인하세요.';document.querySelector('.intro').insertAdjacentElement('afterend',safetyNotice);
function refreshPlaceRating(){const heading=detail.querySelector('.top h2'),id=detail.dataset.placeId;if(!heading||id===undefined)return;heading.querySelector('.place-rating')?.remove();const stat=(window.seaGuideRecommendationStats||{})[id]||{count:0,average:0};const rating=document.createElement('span');rating.className='place-rating';rating.innerHTML='★ '+(stat.count?stat.average.toFixed(1):'–')+' <small>(후기 '+stat.count+'개)</small>';heading.append(rating)}
function refreshPlaceAddress(){const titleBlock=detail.querySelector('.top > div'),id=detail.dataset.placeId;if(!titleBlock||id===undefined)return;titleBlock.querySelector('.place-address')?.remove();const address=document.createElement('div');address.className='place-address';address.textContent='📍 '+(places[id].address||'상세 위치 정보 확인 필요');titleBlock.querySelector('h2').insertAdjacentElement('afterend',address)}
new MutationObserver(()=>{const unavailable=Boolean(detail.querySelector('.badge.black'));detail.classList.toggle('not-available',unavailable);if(unavailable){const labels=detail.querySelectorAll('.warning b');if(labels[0])labels[0].textContent='이용 제한 사유';if(labels[1]){labels[1].textContent='현장 안전 유의 사항';labels[1].parentElement.childNodes.forEach(node=>{if(node.nodeType===Node.TEXT_NODE)node.textContent=node.textContent.replace(/\(?\d+점\)?[，,]?\s*/g,'').replace(/\s{2,}/g,' ')})}}if(!detail.querySelector('.place-rating'))refreshPlaceRating();if(!detail.querySelector('.place-address'))refreshPlaceAddress()}).observe(detail,{childList:true});
refreshPlaceRating();
refreshPlaceAddress();
let recommendationSort='random',recommendationStats={},unsubscribeRecommendationReviews=null;
function recommendationCards(){let items=Object.entries(places).filter(([,place])=>place.color!=='black');if(recommendationSort==='reviews')items.sort((a,b)=>((recommendationStats[b[0]]||{}).count||0)-((recommendationStats[a[0]]||{}).count||0));else if(recommendationSort==='rating')items.sort((a,b)=>((recommendationStats[b[0]]||{}).average||0)-((recommendationStats[a[0]]||{}).average||0));else items=items.sort(()=>Math.random()-.5);return items.slice(0,5).map(([id,place])=>{const stat=recommendationStats[id]||{count:0,average:0};return '<button class="recommend-card" type="button" data-recommend-id="'+id+'"><h4>'+place.name+'</h4><p>'+place.reason+'</p><div class="recommend-meta"><span>★ '+(stat.count?stat.average.toFixed(1):'–')+'</span><span>후기 '+stat.count+'개</span></div></button>'}).join('')}
function renderRecommendations(){const list=document.querySelector('#recommendList');if(list)list.innerHTML=recommendationCards()}
function startRecommendationListener(){if(!firebaseReady||unsubscribeRecommendationReviews)return;unsubscribeRecommendationReviews=firestore.onSnapshot(firestore.collection(db,'placeReviews'),snapshot=>{const totals={};snapshot.docs.forEach(doc=>{const review=doc.data(),id=String(review.placeId);if(!totals[id])totals[id]={count:0,total:0};totals[id].count+=1;totals[id].total+=Number(review.rating)||0});recommendationStats=Object.fromEntries(Object.entries(totals).map(([id,value])=>[id,{count:value.count,average:value.total/value.count}]));window.seaGuideRecommendationStats=recommendationStats;renderRecommendations();refreshPlaceRating()},()=>renderRecommendations())}
function setupRecommendations(){const page=document.querySelector('#communityPage'),section=document.createElement('section');section.className='recommend-section';section.innerHTML='<div class="recommend-head"><div><h3>추천 위치</h3><p>사용자 후기 기준으로 부산 바다 장소를 추천해요.</p></div></div><div class="recommend-sorts"><button class="recommend-sort active" type="button" data-recommend-sort="random">랜덤</button><button class="recommend-sort" type="button" data-recommend-sort="reviews">후기 개수순</button><button class="recommend-sort" type="button" data-recommend-sort="rating">별점순</button></div><div class="recommend-list" id="recommendList"></div>';page.append(section);renderRecommendations();page.addEventListener('click',event=>{const sortButton=event.target.closest('[data-recommend-sort]');if(sortButton){recommendationSort=sortButton.dataset.recommendSort;page.querySelectorAll('.recommend-sort').forEach(button=>button.classList.toggle('active',button===sortButton));renderRecommendations();return}const card=event.target.closest('[data-recommend-id]');if(card){const id=Number(card.dataset.recommendId);page.hidden=true;document.querySelector('#guidePage').hidden=false;document.querySelectorAll('.page-tab').forEach(button=>button.classList.toggle('active',button.dataset.page==='guide'));show(id);setTimeout(()=>map.invalidateSize(),0)}});document.querySelector('.page-tabs').addEventListener('click',event=>{if(event.target.closest('[data-page="community"]'))startRecommendationListener()})}
function setupAttachmentConsent(){const form=document.querySelector('#postForm'),input=document.createElement('input'),button=document.createElement('button'),status=document.createElement('p');input.type='file';input.id='postFiles';input.multiple=true;input.accept='image/*,.pdf,.txt,.doc,.docx';input.hidden=true;button.type='button';button.className='attach-btn';button.textContent='📎 사진·파일 첨부';status.className='attach-files';status.textContent='개인정보 안내 확인 후 사진 또는 파일을 선택할 수 있어요.';form.querySelector('#postText').insertAdjacentElement('afterend',input);input.insertAdjacentElement('afterend',button);button.insertAdjacentElement('afterend',status);button.onclick=()=>{const approved=confirm('개인정보 보호 안내\n\n사진·파일에 얼굴, 실명, 연락처, 집 주소, 차량번호, 정확한 개인 위치가 포함되어 있지 않은지 확인하세요.\n\n본인이 만들었거나 게시 허락을 받은 자료만 올릴 수 있습니다.\n\n확인을 누르면 파일 선택창이 열립니다.');if(approved)input.click()};input.addEventListener('change',()=>{const files=[...input.files];if(files.some(file=>file.size>5*1024*1024)){alert('파일 하나의 크기는 5MB 이하만 첨부할 수 있어요.');input.value='';status.textContent='파일을 다시 선택해 주세요.';return}status.textContent=files.length?'선택한 파일: '+files.map(file=>file.name).join(', '):'파일이 선택되지 않았어요.'});form.addEventListener('reset',()=>{status.textContent='개인정보 안내 확인 후 사진 또는 파일을 선택할 수 있어요.'})}
setupCommunityUI();
setupAuthUI();
setupBoardCategories();
setupBoardSorting();
setupRecommendations();
setupAttachmentConsent();
</script></body></html>
